# ============================================================
# Mosquitto MQTT Broker — Development Configuration
# ============================================================

# Listen on standard MQTT port
listener 1883

# Allow connections without username/password in development
# In production this will be replaced with TLS + auth
allow_anonymous true

# Persistence — save messages to disk so they survive restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all