# ============================================================
# Facility Intelligence — Docker Compose (Full Stack)
# ============================================================
# Runs ALL services: infrastructure + application
#
# Quick start:
#   1. docker compose up -d
#   2. docker compose exec django python manage.py migrate
#   3. docker compose exec django python manage.py seed_data
#   4. Visit http://localhost:8000
#
# Credentials: argus_admin / testpass123
#
# Useful commands:
#   docker compose logs -f django        → Django logs
#   docker compose logs -f celery_worker → Celery logs
#   docker compose logs -f simulator     → Simulator logs
#   docker compose restart django        → Restart one service
#   docker compose down                  → Stop everything
# ============================================================

services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: fi_postgres
    restart: unless-stopped
    env_file: .env.docker
    environment:
      POSTGRES_DB: facility_intelligence
      POSTGRES_USER: fi_user
      POSTGRES_PASSWORD: fi_password
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi_user -d facility_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fi_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@facilityintelligence.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # ============================================================
  # APPLICATION
  # ============================================================

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fi_django
    restart: unless-stopped
    env_file: .env.docker
    command: >
      daphne -b 0.0.0.0 -p 8000
      config.asgi:application
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  fastapi:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: fi_fastapi
    restart: unless-stopped
    env_file: .env.docker
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8001
      --reload
    ports:
      - "8001:8001"
    volumes:
      - ./ingestion:/app
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  mqtt_subscriber:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: fi_mqtt_subscriber
    restart: unless-stopped
    env_file: .env.docker
    command: python -m app.mqtt_subscriber
    volumes:
      - ./ingestion:/app
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fi_celery_worker
    restart: unless-stopped
    env_file: .env.docker
    command: >
      celery -A config.celery worker
      --loglevel=info
      --concurrency=2
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fi_celery_beat
    restart: unless-stopped
    env_file: .env.docker
    command: >
      celery -A config.celery beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fi_simulator
    restart: unless-stopped
    env_file: .env.docker
    command: python simulator.py --mode chaos --speed 3
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
      django:
        condition: service_started

# ============================================================
# NAMED VOLUMES
# ============================================================
volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  pgadmin_data:
  ml_models:
